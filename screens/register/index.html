<body class="h-full flex flex-col font-body-md antialiased">
<!-- Header / TopAppBar Suppressed based on Registration intent -->
<main class="flex-grow flex items-center justify-center px-lg py-xl">
<div class="w-full max-w-md">
<!-- Branding -->
<div class="text-center mb-lg">
<div class="inline-flex items-center justify-center p-sm bg-primary rounded-xl mb-md">
<span class="material-symbols-outlined text-white text-3xl" data-icon="hub">hub</span>
</div>
<h1 class="font-h2 text-h2 text-primary tracking-tighter">ProjectIntel</h1>
<p class="font-body-md text-on-surface-variant mt-xs">Enterprise-grade intelligence orchestration</p>
</div>
<!-- Registration Card -->
<div class="bg-white border border-outline-variant rounded-xl shadow-sm overflow-hidden">
<div class="p-lg">
<div class="mb-lg">
<h2 class="font-h3 text-h3 text-on-surface mb-xs">Create Account</h2>
<p class="font-body-sm text-on-surface-variant">Get started with your collaborative workspace</p>
</div>
<form class="space-y-md">
<!-- Full Name -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="name">Full Name</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-md flex items-center text-outline pointer-events-none">
<span class="material-symbols-outlined text-body-lg" data-icon="person">person</span>
</span>
<input class="w-full pl-xl pr-md py-md bg-surface-container-lowest border border-outline-variant rounded-lg text-body-md focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline-variant" id="name" name="name" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email Address -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-md flex items-center text-outline pointer-events-none">
<span class="material-symbols-outlined text-body-lg" data-icon="mail">mail</span>
</span>
<input class="w-full pl-xl pr-md py-md bg-surface-container-lowest border border-outline-variant rounded-lg text-body-md focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline-variant" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-md flex items-center text-outline pointer-events-none">
<span class="material-symbols-outlined text-body-lg" data-icon="lock">lock</span>
</span>
<input class="w-full pl-xl pr-md py-md bg-surface-container-lowest border border-outline-variant rounded-lg text-body-md focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline-variant" id="password" name="password" placeholder="Min. 8 characters" type="password"/>
</div>
</div>
<!-- Terms -->
<div class="flex items-start space-x-sm pt-xs">
<input class="mt-1 w-4 h-4 text-primary border-outline-variant rounded focus:ring-primary" id="terms" type="checkbox"/>
<label class="font-body-sm text-on-surface-variant leading-tight" for="terms">
                                I agree to the <a class="text-primary font-medium hover:underline" href="#">Terms of Service</a> and <a class="text-primary font-medium hover:underline" href="#">Privacy Policy</a>.
                            </label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-white font-h3 text-body-md py-md rounded-lg hover:bg-on-primary-fixed-variant active:scale-[0.98] transition-all duration-200 shadow-sm flex items-center justify-center space-x-sm mt-lg" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined text-body-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer Link -->
<div class="bg-surface-container-low px-lg py-md border-t border-outline-variant text-center">
<p class="font-body-sm text-on-surface-variant">
                        Already have an account? 
                        <a class="text-primary font-semibold hover:underline ml-xs" href="#">Sign In</a>
</p>

</div>
</div>
</div>
