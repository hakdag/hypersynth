[package]
name = "hypersynth-api"
version = "0.1.0"
edition = "2021"

[dependencies]
argon2 = "0.5"
axum = "0.8"
axum-extra = { version = "0.12.6", features = ["cookie"] }
chrono = "0.4.44"
dotenvy = "0.15"
hex = "0.4.3"
password-hash = "0.5"
rand_core = { version = "0.6", features = ["std"] }
serde = { version = "1", features = ["derive"] }
time = "0.3"
sha2 = "0.11.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "tls-native-tls", "migrate", "uuid", "chrono"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["serde", "v4"] }
